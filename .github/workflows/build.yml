name: Build Secure Lock
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        continue-on-error: true
        run: |
          set +o pipefail
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Keystore cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: securelock-keystore-v1
      - name: Build
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "===== HATALAR ====="
            grep -E "^e: " build.log | head -30
            grep -E "^e: " build.log | head -10 | while IFS= read -r line; do
              echo "::error::${line#e: file:///home/runner/work/SecureLock/SecureLock/}"
            done
            grep -A 6 "What went wrong" build.log | head -20
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: SecureLock-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Secure Lock build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
